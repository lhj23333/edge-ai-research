[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-web"
version = "0.1.0"
description = "端侧与边缘推理独立 AI 加速器行业研究站"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1", "httpx>=0.27,<1",
  "markdown-it-py>=3,<5", "bleach>=6,<7",
  "sse-starlette>=2,<4",
  "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4",
  "sqlite-vec>=0.1.9,<0.2", "sentence-transformers>=6.2,<7",
  "langchain-text-splitters>=1.1,<2", "jieba>=0.42,<1",
  "trafilatura>=2.3,<3", "pypdf>=6.21,<7",
  "lxml>=6.1.3,<7", "lxml_html_clean>=0.4,<1", "cssselect>=1.2,<2",
  "httpx-sse>=0.4,<0.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.48,<2"]

[project.scripts]
researcher = "researcher.cli:main"

[tool.setuptools.package-data]
researcher = ["templates/*.html", "static/*", "static/fonts/*.woff2", "migrations/*.sql"]
industry = ["*.json", "*.jsonl", "prompts/*.md"]

[tool.setuptools.packages.find]
include = ["researcher*", "industry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
