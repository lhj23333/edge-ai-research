[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-web"
version = "0.1.0"
description = "端侧与边缘推理独立 AI 加速器行业研究站"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1", "httpx>=0.27,<1",
  "markdown-it-py>=3,<5", "bleach>=6,<7",
  "sse-starlette>=2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.48,<2"]

[project.scripts]
researcher = "researcher.cli:main"

[tool.setuptools.package-data]
researcher = ["templates/*.html", "static/*", "migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["researcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
